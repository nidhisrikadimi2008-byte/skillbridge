<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SkillBridge — Academia–Industry Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg1:#030712;--bg2:#0B132B;--card:rgba(15,23,42,.75);--bd:rgba(0,210,255,.25);--tx:#fff;--mu:#94A3B8;--g:#10B981;--y:#F59E0B;--r:#EF4444;--grad:linear-gradient(90deg,#00D2FF,#3A7BD5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--mu);background:radial-gradient(circle at 80% -10%,rgba(0,210,255,.15),transparent 40%),radial-gradient(circle at 0 100%,rgba(58,123,213,.18),transparent 45%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
h1,h2,h3{color:var(--tx);margin:0 0 .5rem}
.wrap{max-width:1100px;margin:auto;padding:16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(3,7,18,.7)}
.logo{font-weight:800;font-size:1.25rem;color:var(--tx);cursor:pointer}.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px;backdrop-filter:blur(8px)}
.btn{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:.95rem}
.btn.o{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.s{padding:6px 12px;font-size:.85rem}
.back{margin-bottom:12px}
input,select,textarea{width:100%;background:#0D1B2A;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font:inherit;margin:4px 0 10px}
input[type=range]{padding:0;margin:0;accent-color:#00D2FF}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:10px}.tabs .btn{white-space:nowrap}
.bar{height:10px;border-radius:6px;background:#1e293b;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:10px 0 4px;color:var(--tx);font-size:.92rem}
.badge{font-size:.72rem;padding:2px 8px;border-radius:20px;font-weight:700;color:#031}.G{background:var(--g)}.Y{background:var(--y)}.R{background:var(--r)}
.hero{text-align:center;padding:48px 8px 24px}.hero h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.1}.hero h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.roles div{border:1px solid var(--bd);border-radius:10px;padding:10px 4px;text-align:center;cursor:pointer;color:var(--tx);font-size:.85rem}.roles .on{background:var(--grad)}
.stat{font-size:1.8rem;font-weight:800;color:var(--tx)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:2px 9px;margin:2px;font-size:.75rem;color:#7dd3fc}
.match{font-weight:800;font-size:1.1rem}
#toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--grad);color:#fff;padding:10px 18px;border-radius:30px;display:none;z-index:9}
@media print{nav,.back,.tabs,.noprint{display:none}body{background:#fff}.card{background:#fff;color:#000;border-color:#ccc}.card *{color:#000!important}}
</style></head><body>
<nav><div class="logo" onclick="go('landing',1)">Skill<b>Bridge</b></div><div id="nr"></div></nav>
<div class="wrap" id="app"></div><div id="toast"></div>
<script>
// ===== Mock API layer (mirrors the Spring Boot endpoints) =====
const REQ={"Backend Developer":{Java:85,"Spring Boot":80,SQL:80,Docker:70,DSA:85,React:40},"Data Scientist":{Python:90,ML:85,SQL:80,DSA:70,Docker:50,React:20},"Full Stack Developer":{React:85,Java:70,SQL:75,Docker:60,DSA:75,"Spring Boot":65}};
const RES={Java:"Java Programming Masterclass (NPTEL)","Spring Boot":"Spring Boot REST APIs — Build 3 projects",React:"React 18 Complete Guide + mini project",Docker:"Docker & Kubernetes crash course",SQL:"SQL for Data Engineering (Mode)",DSA:"DSA in Java — 100 problems sprint",ML:"Machine Learning Specialization (Coursera)",Python:"Python for Everybody"};
let OPPS=[{id:1,co:"TechNova",title:"Backend Intern",type:"INTERNSHIP",skills:["Java","Spring Boot","SQL"],d:"Build REST services for a fintech platform.",loc:"Bengaluru · 6 mo · ₹25k/mo"},
{id:2,co:"DataWave",title:"ML Research Project",type:"PROJECT",skills:["Python","ML","SQL"],d:"Churn prediction pipeline for telecom.",loc:"Remote · 8 weeks"},
{id:3,co:"CloudKart",title:"Full Stack Intern",type:"INTERNSHIP",skills:["React","Java","SQL","Docker"],d:"Ship features for a retail e-commerce app.",loc:"Pune · 3 mo · ₹20k/mo"},
{id:4,co:"InfraLabs",title:"DevOps Project",type:"PROJECT",skills:["Docker","Java","DSA"],d:"Containerise legacy services with CI/CD.",loc:"Remote · 6 weeks"},
{id:5,co:"AlgoWorks",title:"Software Engineer Intern",type:"INTERNSHIP",skills:["DSA","Java","Python"],d:"Optimise core search algorithms.",loc:"Hyderabad · 6 mo · ₹30k/mo"}];
const CANDS=[{n:"Aarav Mehta",c:"IIT Indore",s:{Java:92,"Spring Boot":85,SQL:88,DSA:90,Docker:70,Python:60,React:45,ML:30}},{n:"Diya Nair",c:"NIT Calicut",s:{Python:90,ML:86,SQL:82,DSA:75,Java:50,Docker:55,React:40,"Spring Boot":30}},{n:"Kabir Singh",c:"VIT Vellore",s:{React:88,Java:72,SQL:70,Docker:65,DSA:68,Python:55,ML:25,"Spring Boot":55}},{n:"Meera Iyer",c:"BITS Pilani",s:{DSA:94,Java:80,Python:85,SQL:60,Docker:50,React:50,ML:55,"Spring Boot":45}},{n:"Rohan Das",c:"JU Kolkata",s:{Java:60,SQL:55,DSA:58,Docker:30,React:35,Python:50,ML:20,"Spring Boot":25}}];
const DEMAND=[["Generative AI",94],["Cloud & DevOps",81],["Cybersecurity",74],["Spring Boot / Microservices",68],["Data Engineering",63],["Rust / Systems",41]];
const sc=(s,req)=>Math.round(req.reduce((a,k)=>a+Math.min(s[k]||0,100),0)/req.length);
const st=v=>v>=85?"G":v>=60?"Y":"R", lbl={G:"Strong",Y:"Needs work",R:"Critical gap"};
const COL={G:"var(--g)",Y:"var(--y)",R:"var(--r)"};
const api={
 profile:()=>({...P,analysis:Object.entries(P.skills).map(([k,v])=>({skill:k,level:v,status:st(v),req:(REQ[P.target]||{})[k]||0}))}),
 recs:()=>Object.entries(REQ[P.target]).map(([k,r])=>({skill:k,gap:r-(P.skills[k]||0),res:RES[k]})).filter(x=>x.gap>0).sort((a,b)=>b.gap-a.gap),
 opps:()=>OPPS.map(o=>({...o,m:sc(P.skills,o.skills)})).sort((a,b)=>b.m-a.m),
 applicants:id=>{const o=OPPS.find(x=>x.id==id);return CANDS.concat([{n:P.name+" (you)",c:P.college,s:P.skills}]).map(c=>({...c,m:sc(c.s,o.skills)})).sort((a,b)=>b.m-a.m)},
 post:o=>{o.id=Date.now();OPPS.unshift(o)}
};
// ===== State =====
let P={name:"Student",college:"Your College",cgpa:"8.2",target:"Backend Developer",goals:"Become a backend engineer at a product company.",projects:"Campus Placement Portal — Spring Boot + MySQL\nExpense Tracker — React + Node",certs:"Oracle Java SE 11, NPTEL DSA",skills:{Java:88,Python:72,React:55,SQL:78,Docker:40,DSA:82,"Spring Boot":50,ML:35}};
try{const x=localStorage.getItem("sb");if(x)P=JSON.parse(x)}catch(e){}
const save=()=>{try{localStorage.setItem("sb",JSON.stringify(P))}catch(e){}};
let S={v:"landing",h:[],role:"student",tab:"heat",applied:{},sl:{},wk:{},oid:1,f:"ALL",q:"",mode:"in"};
const $=id=>document.getElementById(id);
const toast=m=>{const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
function go(v,reset){if(reset)S.h=[];else S.h.push(S.v);S.v=v;S.tab="heat";draw();scrollTo(0,0)}
function back(){S.v=S.h.pop()||"landing";draw()}
const backBtn=()=>S.h.length?`<button class="btn o s back" onclick="back()">← Go Back</button>`:"";
const bar=(v,c)=>`<div class="bar"><i style="width:${v}%;background:${c}"></i></div>`;
const tabs=(a,t)=>`<div class="tabs">${a.map(([k,l])=>`<button class="btn ${t==k?"":"o"} s" onclick="S.tab='${k}';draw()">${l}</button>`).join("")}</div>`;
// ===== Views =====
function landing(){return`<div class="hero"><span class="tag">SIH 2026 · PS 26044</span><h1>Bridge the gap between <span>campus</span> and <span>careers</span></h1><p style="max-width:620px;margin:12px auto 22px">AI skill mapping, smart internship matching and placement analytics — connecting students, companies and colleges on one platform.</p><button class="btn" onclick="document.getElementById('auth').scrollIntoView({behavior:'smooth'})">Get Started</button></div>
<div class="grid">${[["🎯","AI Skill-Gap Heatmap","See exactly where you stand vs industry needs."],["🤝","Smart Matching","Internships ranked by compatibility %."],["🗺️","Roadmap & Resume","Learning path and auto-built resume."],["📈","Demand Prediction","Colleges plan workshops from live trends."]].map(f=>`<div class="card"><div style="font-size:1.8rem">${f[0]}</div><h3>${f[1]}</h3>${f[2]}</div>`).join("")}</div>
<div class="card" id="auth" style="max-width:440px;margin:24px auto"><h2>${S.mode=="in"?"Sign In":"Create Account"}</h2><div class="roles">${[["student","🎓 Student"],["company","🏢 Recruiter"],["admin","🏛️ College"]].map(r=>`<div class="${S.role==r[0]?"on":""}" onclick="S.role='${r[0]}';draw()">${r[1]}</div>`).join("")}</div>
${S.mode=="up"?'<input id="nm" placeholder="Full name">':""}<input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="login()">Continue as ${S.role}</button><p style="text-align:center;cursor:pointer;color:#7dd3fc" onclick="S.mode=S.mode=='in'?'up':'in';draw()">${S.mode=="in"?"New here? Sign up":"Have an account? Sign in"}</p><small>Demo mode: any details work.</small></div>`}
function login(){const n=$("nm");if(n&&n.value){P.name=n.value;save()}toast("Welcome to SkillBridge!");go(S.role)}
function student(){const T=[["heat","Skill Heatmap"],["learn","Learn Next"],["opp","Opportunities"],["prof","Profile"],["road","Roadmap & Resume"]];let b="";
if(S.tab=="heat"){const a=api.profile().analysis,avg=Math.round(a.reduce((x,y)=>x+y.level,0)/a.length);
b=`<div class="grid"><div class="card"><div>Placement readiness</div><div class="stat">${avg}%</div>${bar(avg,"var(--grad)")}<p>Target: <b style="color:#fff">${P.target}</b></p></div><div class="card"><div>Legend</div><p><span class="badge G">85%+</span> Strong<br><span class="badge Y">60–84</span> Needs improvement<br><span class="badge R"><60</span> Critical gap</p></div></div><div class="card"><h3>AI Skill-Gap Heatmap</h3>${a.map(x=>`<div class="row"><span>${x.skill}</span><span><span class="badge ${x.status}">${lbl[x.status]}</span> ${x.level}%${x.req?` / need ${x.req}%`:""}</span></div>${bar(x.level,COL[x.status])}`).join("")}</div>`}
if(S.tab=="learn"){const r=api.recs();b=`<div class="card"><h3>What should I learn next?</h3>Top priorities for ${P.target}, ranked by gap size.</div>${r.length?r.map((x,i)=>`<div class="card"><div class="row"><b>#${i+1} ${x.skill}</b><span class="badge ${x.gap>35?"R":"Y"}">−${x.gap} pts</span></div>📚 ${x.res}</div>`).join(""):"<div class='card'>🎉 You meet every requirement!</div>"}`}
if(S.tab=="opp"){const o=api.opps().filter(x=>(S.f=="ALL"||x.type==S.f)&&(x.title+x.co+x.skills.join()).toLowerCase().includes(S.q.toLowerCase()));
b=`<div class="grid"><input placeholder="Search role, company, skill…" value="${S.q}" onchange="S.q=this.value;draw()"><select onchange="S.f=this.value;draw()">${["ALL","INTERNSHIP","PROJECT"].map(f=>`<option ${S.f==f?"selected":""}>${f}</option>`).join("")}</select></div>${o.map(x=>`<div class="card"><div class="row"><div><h3 style="margin:0">${x.title}</h3>${x.co} · ${x.type}</div><div class="match" style="color:${COL[st(x.m)]}">${x.m}% Match${x.m>=85?" ⭐":""}</div></div>${bar(x.m,COL[st(x.m)])}<p>${x.d}<br><small>${x.loc}</small></p>${x.skills.map(s=>`<span class="tag">${s}</span>`).join("")}<br><br><button class="btn s" ${S.applied[x.id]?"disabled":""} onclick="S.applied[${x.id}]=1;toast('Application sent!');draw()">${S.applied[x.id]?"Applied ✓":"Apply"}</button></div>`).join("")||"<div class='card'>No matches.</div>"}`}
if(S.tab=="prof"){b=`<div class="card"><h3>Academic & Career Details</h3>Name<input id="pn" value="${P.name}">College<input id="pc" value="${P.college}">CGPA<input id="pg" value="${P.cgpa}">Target role<select id="pt">${Object.keys(REQ).map(k=>`<option ${P.target==k?"selected":""}>${k}</option>`).join("")}</select>Career goals<textarea id="pl" rows=2>${P.goals}</textarea>Projects (one per line)<textarea id="pp" rows=3>${P.projects}</textarea>Certifications<input id="pe" value="${P.certs}"><button class="btn" onclick="saveP()">Save profile</button></div><div class="card"><h3>Technical Skills</h3>${Object.entries(P.skills).map(([k,v])=>`<div class="row"><span>${k}</span><span>${v}%</span></div><input type="range" min=0 max=100 value="${v}" onchange="P.skills['${k}']=+this.value;save();draw()">`).join("")}<div class="grid"><input id="ns" placeholder="New skill"><button class="btn o" onclick="addS()">+ Add skill</button></div></div>`}
if(S.tab=="road"){const r=api.recs().slice(0,4);b=`<div class="card"><h3>Career Roadmap → ${P.target}</h3>${[["Month 1",r[0]],["Month 2",r[1]],["Month 3",r[2]],["Month 4",r[3]]].map(([m,x])=>x?`<div class="row"><b>${m}</b><span>Master ${x.skill}</span></div><small>${x.res}</small>`:"").join("")}<div class="row"><b>Month 5</b><span>Apply to top-matched internships</span></div><div class="row"><b>Month 6</b><span>Mock interviews & placement drives</span></div></div>
<div class="card"><div class="row"><h3>AI Resume</h3><button class="btn s noprint" onclick="print()">Download / Print</button></div><h2>${P.name}</h2><small>${P.college} · CGPA ${P.cgpa}</small><p><b style="color:#fff">Objective:</b> ${P.goals}</p><b style="color:#fff">Skills:</b><br>${Object.entries(P.skills).filter(([k,v])=>v>=60).map(([k,v])=>`<span class="tag">${k} ${v}%</span>`).join("")}<p><b style="color:#fff">Projects:</b></p>${P.projects.split("\n").filter(Boolean).map(x=>`• ${x}<br>`).join("")}<p><b style="color:#fff">Certifications:</b> ${P.certs}</p></div>`}
return`<h2>Student Dashboard</h2>${tabs(T,S.tab)}${b}`}
function saveP(){P.name=$("pn").value;P.college=$("pc").value;P.cgpa=$("pg").value;P.target=$("pt").value;P.goals=$("pl").value;P.projects=$("pp").value;P.certs=$("pe").value;save();toast("Profile saved");draw()}
function addS(){const v=$("ns").value.trim();if(v){P.skills[v]=50;save();draw()}}
function company(){const T=[["cand","Ranked Candidates"],["post","Post Opportunity"]];let b="";
if(S.tab=="post"){b=`<div class="card"><h3>Publish an opening</h3>Company<input id="oc" value="My Company">Title<input id="ot" placeholder="e.g. Backend Intern">Type<select id="oy"><option>INTERNSHIP</option><option>PROJECT</option></select>Required tech stack (comma separated)<input id="os" placeholder="Java, SQL, Docker">Description<textarea id="od" rows=3></textarea><button class="btn" onclick="postO()">Publish</button></div>`}
else{const c=api.applicants(S.oid);b=`<div class="card">Select opening<select onchange="S.oid=this.value;draw()">${OPPS.map(o=>`<option value="${o.id}" ${o.id==S.oid?"selected":""}>${o.title} — ${o.co}</option>`).join("")}</select></div>${c.map((x,i)=>`<div class="card"><div class="row"><div><h3 style="margin:0">#${i+1} ${x.n}</h3>${x.c}</div><div class="match" style="color:${COL[st(x.m)]}">${x.m}%</div></div>${bar(x.m,COL[st(x.m)])}<br><button class="btn s ${S.sl[S.oid+x.n]?"":"o"}" onclick="S.sl['${S.oid+x.n}']=1;toast('Shortlisted');draw()">${S.sl[S.oid+x.n]?"Shortlisted ✓":"Shortlist"}</button></div>`).join("")}`}
return`<h2>Recruiter Dashboard</h2>${tabs(T,S.tab=="post"?"post":"cand")}${b}`}
function postO(){const t=$("ot").value.trim(),s=$("os").value.split(",").map(x=>x.trim()).filter(Boolean);if(!t||!s.length)return toast("Add title & skills");api.post({co:$("oc").value,title:t,type:$("oy").value,skills:s,d:$("od").value||"—",loc:"Posted just now"});S.oid=OPPS[0].id;toast("Opportunity published!");S.tab="cand";draw()}
function admin(){const all=CANDS.map(c=>({n:c.n,r:Math.round(Object.values(c.s).reduce((a,b)=>a+b,0)/8)}));const avg=Math.round(all.reduce((a,b)=>a+b.r,0)/all.length),ready=all.filter(x=>x.r>=60).length;
return`<h2>College Dashboard</h2><div class="grid"><div class="card">Batch readiness<div class="stat">${avg}%</div>${bar(avg,"var(--grad)")}</div><div class="card">Placement-ready<div class="stat">${ready}/${all.length}</div>students ≥ 60%</div><div class="card">Live openings<div class="stat">${OPPS.length}</div>from partner companies</div></div>
<div class="card"><h3>Institutional progress tracker</h3>${all.sort((a,b)=>b.r-a.r).map(x=>`<div class="row"><span>${x.n}</span><span class="badge ${st(x.r)}">${x.r}%</span></div>${bar(x.r,COL[st(x.r)])}`).join("")}</div>
<div class="card"><h3>Industry demand prediction</h3>${DEMAND.map(d=>`<div class="row"><span>${d[0]}</span><span>${d[1]}% demand</span></div>${bar(d[1],"var(--grad)")}${d[1]>=60?`<button class="btn o s" style="margin-top:6px" onclick="S.wk['${d[0]}']=1;toast('Workshop scheduled');draw()">${S.wk[d[0]]?"Workshop scheduled ✓":"Organise workshop"}</button>`:""}`).join("")}</div>`}
function draw(){const m={landing,student,company,admin};$("app").innerHTML=backBtn()+m[S.v]();$("nr").innerHTML=S.v=="landing"?"":`<button class="btn o s" onclick="toast('Signed out');go('landing',1)">Sign out</button>`}
draw();
</script></body></html>
